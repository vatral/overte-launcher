name: Windows CI

on:
  push:
  pull_request:

env:
  QT_VERSION: "6.10.*"
  BUILD_CONFIG: Release

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S OverteLauncher -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config $env:BUILD_CONFIG --parallel

      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir build/OverteLauncherTests -C $env:BUILD_CONFIG --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
